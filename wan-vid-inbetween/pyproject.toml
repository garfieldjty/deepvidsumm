[project]
name = "wan-vid-inbetween"
version = "0.1.0"
description = "Video inbetweening with Wan model"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = []

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "diffusers>=0.20.0",
    "peft>=0.4.0",
    "accelerate>=0.20.0",
    "numpy>=1.24.0",
    "pillow>=9.0.0",
    "opencv-python>=4.7.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "imageio>=2.28.0",
    "imageio-ffmpeg>=0.4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = []
